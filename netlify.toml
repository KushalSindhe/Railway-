# Netlify configuration for Bharat Rail Reservation System

[build]
  # The directory containing the static web frontend
  publish = "web"

# Uncomment and update when your Java backend is hosted (e.g., Render, Railway.app, Fly.io)
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend-service.onrender.com/api/:splat"
#   status = 200
#   force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
